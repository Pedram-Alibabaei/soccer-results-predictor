[project]
name = "soccer-results-predictor"
version = "0.1.0"
description = "A soccer match probability and betting-value research project."
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
where = ["src"]
